<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mis Cuentas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Cuentas">
<meta name="theme-color" content="#E8F6FE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06121D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --sky-50:#EEF8FE; --sky-100:#D9F0FD; --sky-300:#7DD3FC; --sky-400:#38BDF8; --sky-500:#0EA5E9; --sky-600:#0284C7;
  --indigo:#5E5CE6; --mint:#2DD4BF; --peach:#FFB86B;
  --green:#22C55E; --green-bg:#E3F9EA; --red:#FF3B30; --red-bg:#FFE7E5; --green-text:#15803D; --red-text:#DC2626; --sky-700:#0369A1;
  --bg:#EEF7FD; --surface:#FFFFFF; --surface-2:#F5FAFE; --text:#0B1B2B; --muted:#6B7F93; --line:rgba(11,27,43,.07);
  --glass:rgba(255,255,255,.72); --scrim:rgba(6,30,50,.28);
  --shadow-s:0 1px 2px rgba(14,80,130,.06),0 4px 14px rgba(14,80,130,.06);
  --shadow-l:0 10px 40px rgba(14,120,200,.25);
  --ease-ios:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.36,.64,1);
  --lg-top:rgba(255,255,255,.58); --lg-bottom:rgba(232,245,253,.40); --lg-edge:rgba(255,255,255,.9);
  --lg-rim:rgba(255,255,255,.35); --lg-shadow:rgba(14,90,150,.18); --lg-sheen:rgba(255,255,255,.55);
  --lg-fill:rgba(255,255,255,.42); --lg-fill-rim:rgba(255,255,255,.7);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#06121D; --surface:#0E1E2C; --surface-2:#132738; --text:#EAF5FD; --muted:#8AA3B8; --line:rgba(255,255,255,.08);
  --glass:rgba(14,30,44,.7); --scrim:rgba(0,0,0,.5);
  --green-bg:rgba(34,197,94,.16); --red-bg:rgba(255,59,48,.16); --green-text:#4ADE80; --red-text:#FF6B61;
  --shadow-s:0 1px 2px rgba(0,0,0,.3); --shadow-l:0 10px 30px rgba(0,0,0,.5);
  --lg-top:rgba(22,44,64,.62); --lg-bottom:rgba(8,22,36,.55); --lg-edge:rgba(255,255,255,.22);
  --lg-rim:rgba(255,255,255,.08); --lg-shadow:rgba(0,0,0,.45); --lg-sheen:rgba(125,211,252,.14);
  --lg-fill:rgba(255,255,255,.07); --lg-fill-rim:rgba(255,255,255,.12);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--text);
  font:100%/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none;background:var(--bg)}
@media (prefers-color-scheme:dark){.card,.fab,.primary,.sheet[data-type] .primary,.opt,.toast{box-shadow:0 10px 30px rgba(0,0,0,.5)!important}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 120px)}

/* Fondo vivo: manchas de color que flotan despacio por toda la pantalla.
   Degradados radiales en vez de filter:blur → mismo aspecto difuminado, mucho más barato en el móvil. */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:85vmax;height:85vmax;border-radius:50%;will-change:transform;
  background:radial-gradient(circle,var(--c) 0%,transparent 62%);opacity:.55;animation:float-a 26s ease-in-out infinite alternate}
.bg i:nth-child(1){--c:#38BDF8;left:-35vmax;top:-30vmax}
.bg i:nth-child(2){--c:#7DD3FC;right:-40vmax;top:5vh;animation-name:float-b;animation-duration:31s}
.bg i:nth-child(3){--c:#2DD4BF;left:-30vmax;top:45vh;opacity:.4;animation-duration:23s;animation-delay:-8s}
.bg i:nth-child(4){--c:#818CF8;right:-35vmax;bottom:-35vmax;opacity:.38;animation-name:float-b;animation-duration:28s;animation-delay:-12s}
.bg i:nth-child(5){--c:#BAE6FD;left:10vw;top:20vh;width:60vmax;height:60vmax;opacity:.5;animation-duration:35s;animation-delay:-4s}
@keyframes float-a{to{transform:translate(12vmax,9vmax) scale(1.15)}}
@keyframes float-b{to{transform:translate(-10vmax,12vmax) scale(.9)}}
@media (prefers-color-scheme:dark){.bg i{opacity:.22} .bg i:nth-child(n+3){opacity:.16}}

/* Cabecera */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 16px}
.top small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.top h1{margin:0;font-size:1.9rem;line-height:1.1;letter-spacing:-.025em;font-weight:800}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#0275B5,var(--indigo));box-shadow:var(--shadow-s)}

/* Tarjeta de saldo */
/* Manchas de color detrás del cristal: el desenfoque las convierte en celeste líquido */
/* Carrusel Saldo ↔ Resumen: el ancho de página + hueco se mide en JS */
/* Recorta solo en horizontal: el difuminado de las manchas sigue libre arriba y abajo */
.pager{overflow-x:clip;overflow-y:visible;margin:0 -16px;padding:0 16px 14px;touch-action:pan-y}
.track{display:flex;gap:32px;align-items:stretch;will-change:transform}
.page{flex:0 0 100%;min-width:0;display:flex;transform-origin:50% 50%}
.page .card-wrap{flex:1;min-width:0;display:flex}
.page .card{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.dots{position:relative;display:flex;justify-content:center;gap:2px}
.pdot{padding:8px 0}
.pdot i{display:block;width:20px;height:7px;border-radius:4px;background:rgba(10,37,64,.22);transform:scaleX(.35);
  transition:transform .35s var(--ease-ios),background-color .35s}
.pdot.on i{transform:none;background:var(--sky-700)}
@media (prefers-color-scheme:dark){.pdot i{background:rgba(255,255,255,.25)} .pdot.on i{background:var(--sky-300)}}

/* Tarjeta de resumen */
.sum-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.legend{display:flex;gap:10px;font-size:.72rem;font-weight:700;color:#24506F}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.legend .lo i{background:var(--red)}
.net{font-size:1.45rem;font-weight:800;letter-spacing:-.025em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.net small{font-size:.75rem;font-weight:700;color:#24506F;letter-spacing:0;margin-left:4px}
#chart{display:block;width:100%;height:118px;overflow:visible}
#chart text{font:600 10px -apple-system,system-ui,sans-serif;fill:#24506F;text-anchor:middle}
#chart .grid{stroke:rgba(10,37,64,.1);stroke-dasharray:3 4}
@media (prefers-color-scheme:dark){.legend,.net small{color:#B5D3E8} #chart text{fill:#B5D3E8} #chart .grid{stroke:rgba(255,255,255,.12)}}

.card-wrap{position:relative;isolation:isolate}
.blob{position:absolute;z-index:-1;border-radius:50%;filter:blur(28px);pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.blob.b1{width:210px;height:210px;left:-30px;top:-30px;background:#38BDF8}
.blob.b2{width:180px;height:180px;right:-20px;top:10px;background:#7DD3FC;animation-delay:-5s}
.blob.b3{width:170px;height:150px;left:35%;bottom:-40px;background:#2DD4BF;opacity:.75;animation-delay:-9s}
.blob.b4{width:120px;height:120px;right:10%;bottom:-20px;background:#818CF8;opacity:.6;animation-delay:-3s}
.card{position:relative;overflow:hidden;border-radius:28px;padding:22px 22px 18px;color:#0A2540;
  background:rgba(255,255,255,.42);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.45),0 8px 24px rgba(14,120,200,.14);
  animation:rise .7s var(--ease-ios) both}
.card .label{font-size:.85rem;font-weight:700;color:#24506F}
.balance{font-size:clamp(2.4rem,11vw,3.1rem);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 18px;font-variant-numeric:tabular-nums;
  transition:color .45s var(--ease-ios)}
/* Mientras el saldo cuenta: verde si entra dinero, rojo si sale (sin transición al encenderse, para que se note al instante) */
.balance.counting-in{color:var(--green-text);transition:none}
.balance.counting-out{color:var(--red-text);transition:none}
.stats{display:grid;grid-template-columns:1fr 1fr;position:relative;z-index:1;padding-top:14px;border-top:1px solid rgba(10,37,64,.1)}
.stat{padding:0 4px}
.stat+.stat{padding-left:16px;border-left:1px solid rgba(10,37,64,.1)}
.stat span{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;color:#24506F}
@media (prefers-color-scheme:dark){
  .blob{opacity:.45} .blob.b3,.blob.b4{opacity:.35}
  .card{color:#EAF5FD;background:rgba(10,30,48,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.5)!important}
  .card .label,.stat span{color:#B5D3E8}
  .stats,.stat+.stat{border-color:rgba(255,255,255,.1)}
}
.stat b{display:block;font-size:1.05rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-style:normal;background:#fff}
.dot.in{color:var(--green-text)} .dot.out{color:var(--red-text)}

/* Movimientos */
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:26px 6px 8px}
.section-title h2{margin:0;font-size:1.25rem;letter-spacing:-.015em}
.section-title span{color:var(--muted);font-size:.85rem}
.day{display:flex;justify-content:space-between;margin:18px 8px 8px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day b{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0}
.list{display:flex;flex-direction:column;gap:8px}
/* Cada movimiento es su propia burbuja de cristal; al soltar rebota con muelle */
.mov{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;position:relative;border-radius:22px;
  background:rgba(255,255,255,.58);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.4),0 4px 16px rgba(14,100,170,.08);
  transition:transform .45s var(--spring)}
.mov.enter{animation:rise .55s var(--ease-ios) backwards}
.mov:active{transform:scale(.97);transition-duration:.1s}
@media (prefers-color-scheme:dark){
  .mov{background:rgba(14,30,44,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.06),0 4px 16px rgba(0,0,0,.3)}
}
.ico{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:1.25rem}
.mov .txt{flex:1;min-width:0}
.mov .txt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .txt small{color:var(--muted);font-size:.8rem}
.amt{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.amt.in{color:var(--green-text)} .amt.out{color:var(--red-text)}
.mov.leaving{animation:leave .35s var(--ease-ios) forwards}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty div{font-size:2.6rem;margin-bottom:6px;animation:float 3s ease-in-out infinite}

/* Botón + y menú */
.dock{position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 96px);pointer-events:none;
  background:linear-gradient(to top,var(--bg) 35%,transparent)}
.fab{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:30;width:64px;height:64px;margin-left:-32px;
  border-radius:50%;color:#fff;display:grid;place-items:center;
  background:linear-gradient(145deg,#0275B5,var(--sky-700));box-shadow:0 8px 24px rgba(14,165,233,.45),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .45s var(--spring),box-shadow .2s}
.fab:active{transform:scale(.92)}
.fab svg{transition:transform .45s var(--spring)}
body.menu-open .fab svg,body.sheet-open .fab svg{transform:rotate(135deg)}
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .3s ease}
body.menu-open .scrim,body.sheet-open .scrim{opacity:1;pointer-events:auto}
/* Con una hoja de cristal abierta el velo es más ligero: el fondo vivo y la tarjeta se ven a través */
body.sheet-open .scrim{background:color-mix(in srgb,var(--scrim) 55%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.menu{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);z-index:25;transform:translateX(-50%);
  display:flex;gap:12px;pointer-events:none}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;width:118px;padding:16px 10px;border-radius:24px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--shadow-l);font-weight:700;
  opacity:0;transform:translateY(40px) scale(.6);transition:transform .45s var(--spring),opacity .25s ease}
.opt .ico{width:48px;height:48px;border-radius:16px;font-size:1.4rem;color:#fff}
.opt.in .ico{background:linear-gradient(145deg,#4ADE80,var(--green))}
.opt.out .ico{background:linear-gradient(145deg,#FF7A70,var(--red))}
.opt.in{transform-origin:100% 100%} .opt.out{transform-origin:0 100%}
body.menu-open .menu{pointer-events:auto}
body.menu-open .opt{opacity:1;transform:none}
body.menu-open .opt.out{transition-delay:.05s}
.opt:active{transform:scale(.95)!important}

/* Racimo de categorías: brotan del botón + como burbujas (posición y animación en JS con WAAPI) */
.cluster{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 54px);z-index:26;width:0;height:0;pointer-events:none}
body.cluster-open .cluster{pointer-events:auto}
.cb{position:absolute;left:-50px;top:-27px;width:100px;display:flex;flex-direction:column;align-items:center;gap:3px;
  opacity:0;will-change:transform,opacity;pointer-events:none}
.cb>*{pointer-events:auto}
.cb .ico{width:54px;height:54px;border-radius:50%;font-size:1.5rem;
  background:color-mix(in srgb,var(--c) 22%,var(--surface));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1.5px color-mix(in srgb,var(--c) 45%,transparent),0 8px 20px color-mix(in srgb,var(--c) 30%,transparent)}
.cb span:last-child{padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
body.cluster-open .scrim{opacity:1;pointer-events:auto}
body.cluster-open .fab svg{transform:rotate(135deg)}

/* Hoja inferior */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:520px;margin:0 auto;max-height:92dvh;overflow:auto;
  border-radius:32px 32px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 20px);
  /* Liquid glass: cristal translúcido que tiñe y desenfoca lo de detrás, con el borde iluminado y un reflejo arriba */
  background:linear-gradient(180deg,var(--lg-top),var(--lg-bottom));
  backdrop-filter:blur(30px) saturate(190%) brightness(1.04);-webkit-backdrop-filter:blur(30px) saturate(190%) brightness(1.04);
  box-shadow:inset 0 1px 0 var(--lg-edge),inset 0 0 0 1px var(--lg-rim),0 -18px 50px var(--lg-shadow);
  transform:translateY(105%);transition:transform .5s var(--ease-ios)}
.sheet::before{content:"";position:absolute;inset:0 0 auto;height:120px;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 90% at 30% 0%,var(--lg-sheen),transparent 70%)}
.sheet>*{position:relative}
.sheet.open{transform:translateY(0)}
.sheet.dragging{transition:none}
.grab{padding:6px 0 10px;touch-action:none;cursor:grab}
.grab::before{content:"";display:block;width:38px;height:5px;border-radius:3px;margin:0 auto;background:rgba(120,140,160,.35)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-head h3{margin:0;font-size:1.35rem;letter-spacing:-.02em}
.close{width:32px;height:32px;border-radius:50%;background:var(--lg-fill);box-shadow:inset 0 0 0 1px var(--lg-fill-rim);color:var(--muted);font-size:1.1rem}
.amount-wrap{display:flex;align-items:center;justify-content:center;gap:4px;margin:14px 0 6px;font-weight:800;letter-spacing:-.035em}
.amount-wrap input{width:100%;max-width:260px;text-align:center;border:0;outline:0;background:none;color:inherit;
  font:inherit;font-size:3rem;font-variant-numeric:tabular-nums}
.amount-wrap .cur{font-size:2rem;color:var(--muted)}
.sheet[data-type=in] .amount-wrap{color:var(--green-text)} .sheet[data-type=out] .amount-wrap{color:var(--red-text)}
.amount-wrap.shake{animation:shake .4s}
.field{display:block;width:100%;margin:10px 0;padding:14px 16px;border-radius:16px;border:1px solid transparent;
  background:var(--lg-fill);box-shadow:inset 0 1px 0 var(--lg-fill-rim);color:var(--text);font:inherit;font-size:16px;outline:0;transition:border-color .2s,background .2s}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:color-mix(in srgb,var(--sky-400) 70%,transparent);background:color-mix(in srgb,var(--lg-fill) 100%,rgba(255,255,255,.15))}
.picked{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;margin:4px auto 0;padding:6px 14px 6px 6px;
  border-radius:999px;background:var(--lg-fill);box-shadow:inset 0 1px 0 var(--lg-fill-rim),0 4px 14px var(--lg-shadow);font-weight:700;font-size:.95rem}
.picked .ico{width:30px;height:30px;border-radius:50%;font-size:1rem}
.primary{width:100%;margin-top:14px;padding:16px;border-radius:18px;font-weight:700;font-size:1.05rem;color:#fff;
  background:linear-gradient(145deg,#0275B5,var(--sky-700));box-shadow:0 8px 20px rgba(14,165,233,.35);transition:transform .12s ease-out,opacity .2s;
  position:relative;overflow:hidden}
.primary::after{content:"";position:absolute;inset:0 0 50%;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.28),transparent);pointer-events:none}
.sheet[data-type=in] .primary{background:linear-gradient(145deg,#16A34A,#15803D);box-shadow:0 8px 20px rgba(34,197,94,.35)}
.sheet[data-type=out] .primary{background:linear-gradient(145deg,#EF4444,#DC2626);box-shadow:0 8px 20px rgba(255,59,48,.3)}
.primary:active{transform:scale(.97)}
.danger{width:100%;margin-top:10px;padding:15px;border-radius:18px;font-weight:700;color:var(--red-text);
  background:color-mix(in srgb,var(--red) 14%,transparent);box-shadow:inset 0 1px 0 var(--lg-fill-rim),inset 0 0 0 1px color-mix(in srgb,var(--red) 22%,transparent)}
.danger:active{transform:scale(.97)}
.detail{text-align:center;padding:6px 0 4px}
.detail .ico{width:64px;height:64px;border-radius:20px;font-size:2rem;margin:4px auto 10px}
.detail .amt{font-size:2.2rem;font-weight:800;letter-spacing:-.03em}
.detail p{margin:4px 0;color:var(--muted)}

/* Aviso */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);z-index:60;display:flex;align-items:center;gap:14px;
  padding:12px 12px 12px 18px;border-radius:20px;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--shadow-l);font-weight:600;white-space:nowrap;
  transform:translate(-50%,-160%);transition:transform .5s var(--ease-ios)}
.toast.show{transform:translate(-50%,0)}
.toast button{padding:8px 12px;border-radius:12px;background:var(--sky-100);color:var(--sky-700);font-weight:700}

@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateX(-30%) scale(.95)}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes drift{to{transform:translate(18px,12px) scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{40%{transform:scale(1.03)}}
.card.pop{animation:pop .45s var(--spring)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .sheet,.opt,.toast,.fab,.fab svg{transition:opacity .2s ease!important}
  .bg i{animation:none!important}
}

  .sheet::before{display:none}
  .bg{display:none} body{background:linear-gradient(180deg,var(--sky-100),var(--bg) 60%)}
}

<script>
const CATS = [
  {id:'ocio',         name:'Ocio',          emoji:'🎉', color:'#BF5AF2'},
  {id:'comida',       name:'Comida',        emoji:'🍔', color:'#FF9F0A'},
  {id:'complementos', name:'Complementos',  emoji:'👜', color:'#FF6FAE'},
  {id:'salud',        name:'Salud',         emoji:'💊', color:'#2DD4BF'},
  {id:'coche',        name:'Coche',         emoji:'🚗', color:'#0EA5E9'},
  {id:'hogar',        name:'Hogar',         emoji:'🏠', color:'#A3814F'},
  {id:'suscripciones',name:'Suscripciones', emoji:'📺', color:'#5E5CE6'},
  {id:'ropa',         name:'Ropa',          emoji:'👕', color:'#FF6B6B'},
  {id:'transporte',   name:'Transporte',    emoji:'🚌', color:'#38BDF8'},
  {id:'viajes',       name:'Viajes',        emoji:'✈️', color:'#22D3EE'},
  {id:'regalos',      name:'Regalos',       emoji:'🎁', color:'#F43F5E'},
];
const INCOME = {name:'Ingreso', emoji:'💶', color:'#22C55E'};
const FALLBACK = {id:'otros', name:'Otros', emoji:'✨', color:'#94A3B8'};
const KEY = 'miscuentas.movs.v1';
const $ = s => document.querySelector(s);
const eur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',useGrouping:'always'});
const eur0 = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:'always'});

let movs = load();
let shownBalance = 0, lastDeleted = null;
let firstRender = true, justAdded = null, page = 0, chartDrawn = false, goPage = () => {};
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch {}
  // Datos de ejemplo solo para ver el diseño la primera vez
  const d = n => new Date(Date.now() - n*864e5).toISOString();
  return [
    {id:1,type:'in', amount:1450,  note:'Nómina',                       date:d(6)},
    {id:2,type:'out',amount:38.5,  cat:'comida',        note:'Supermercado', date:d(0)},
    {id:3,type:'out',amount:12.99, cat:'suscripciones', note:'Spotify',      date:d(1)},
    {id:4,type:'out',amount:55,    cat:'coche',         note:'Gasolina',     date:d(1)},
    {id:5,type:'in', amount:120,   note:'Venta Wallapop',               date:d(3)},
    {id:6,type:'out',amount:24,    cat:'ocio',          note:'Cine',         date:d(4)},
  ];
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(movs)); } catch {} }
const catOf = m => m.type === 'in' ? INCOME : (CATS.find(c => c.id === m.cat) || FALLBACK);
const tint = c => `background:color-mix(in srgb, ${c} 16%, transparent)`;
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function dayLabel(iso){
  const d = new Date(iso), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - new Date(iso).setHours(0,0,0,0)) / 864e5);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  return d.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'});
}

function render(tone){
  const total = movs.reduce((s,m) => s + (m.type === 'in' ? m.amount : -m.amount), 0);
  const now = new Date();
  const month = movs.filter(m => { const d = new Date(m.date); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  $('#monthIn').textContent  = eur0.format(month.filter(m => m.type === 'in').reduce((s,m) => s + m.amount, 0));
  $('#monthOut').textContent = eur0.format(month.filter(m => m.type === 'out').reduce((s,m) => s + m.amount, 0));
  countTo(total, tone);
  $('#count').textContent = movs.length ? `${movs.length} en total` : '';

  drawChart(page === 1 && !chartDrawn);

  const sorted = [...movs].sort((a,b) => new Date(b.date) - new Date(a.date));
  if (!sorted.length){
    $('#movs').innerHTML = `<div class="empty"><div>🪙</div>Aún no hay movimientos.<br>Pulsa <b>+</b> para añadir el primero.</div>`;
    return;
  }
  // Agrupa por día conservando el orden: [{label, total, items}]
  const days = [];
  for (const m of sorted){
    const label = dayLabel(m.date);
    if (days.at(-1)?.label !== label) days.push({label, total:0, items:[]});
    const d = days.at(-1);
    d.items.push(m); d.total += m.type === 'in' ? m.amount : -m.amount;
  }
  // Entrada en cascada solo la primera vez (o para el que acabas de añadir), para que no parpadee al guardar
  let i = 0, html = '';
  for (const d of days){
    html += `<div class="day"><span>${d.label}</span><b>${d.total >= 0 ? '+' : '−'}${eur.format(Math.abs(d.total))}</b></div><div class="list">`;
    for (const m of d.items){
      const c = catOf(m), enter = firstRender || m.id === justAdded;
      const delay = firstRender ? Math.min(i++, 10) * 40 : 0;
      html += `<button class="mov${enter ? ' enter' : ''}" data-id="${m.id}"${delay ? ` style="animation-delay:${delay}ms"` : ''}>
        <span class="ico" style="${tint(c.color)}">${c.emoji}</span>
        <span class="txt"><b>${esc(m.note || c.name)}</b><small>${m.type === 'in' ? 'Ingreso' : c.name}</small></span>
        <span class="amt ${m.type}">${m.type === 'in' ? '+' : '−'}${eur.format(m.amount)}</span></button>`;
    }
    html += '</div>';
  }
  $('#movs').innerHTML = html;
  firstRender = false; justAdded = null;
}

// ── Gráfica de resumen: dos curvas suaves en SVG, sin librerías ──
function aggregateByMonth(list, n){
  const now = new Date(), fmt = new Intl.DateTimeFormat('es-ES',{month:'short'});
  const months = Array.from({length:n}, (_, k) => {
    const d = new Date(now.getFullYear(), now.getMonth() - (n - 1 - k), 1);
    return {y:d.getFullYear(), m:d.getMonth(), label:fmt.format(d).replace('.', ''), in:0, out:0};
  });
  for (const mv of list){
    const d = new Date(mv.date);
    const b = months.find(x => x.y === d.getFullYear() && x.m === d.getMonth());
    if (b) b[mv.type] += mv.amount;
  }
  return months;
}
// Catmull-Rom → Bézier: la curva pasa por todos los puntos sin picos
function smoothPath(pts){
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let k = 0; k < pts.length - 1; k++){
    const p0 = pts[k-1] || pts[k], p1 = pts[k], p2 = pts[k+1], p3 = pts[k+2] || p2;
    // Limita los puntos de control al tramo entre los dos meses: sin rebotes por debajo de 0
    const lo = Math.min(p1[1], p2[1]), hi = Math.max(p1[1], p2[1]), clamp = v => Math.max(lo, Math.min(hi, v));
    const c1 = [p1[0] + (p2[0]-p0[0])/6, clamp(p1[1] + (p2[1]-p0[1])/6)];
    const c2 = [p2[0] - (p3[0]-p1[0])/6, clamp(p2[1] - (p3[1]-p1[1])/6)];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1].toFixed(1)}`;
  }
  return d;
}
function drawChart(animate){
  const data = aggregateByMonth(movs, 6);
  const sumIn = data.reduce((s,x) => s + x.in, 0), sumOut = data.reduce((s,x) => s + x.out, 0), net = sumIn - sumOut;
  $('#net').innerHTML = `${net < 0 ? '−' : ''}${eur0.format(Math.abs(net))}<small>${net < 0 ? 'de más gastado' : 'ahorrado'}</small>`;

  const svg = $('#chart'), W = svg.clientWidth || 300, H = 118, top = 8, bottom = H - 18, pad = 14;
  const max = Math.max(1, ...data.flatMap(x => [x.in, x.out])) * 1.1;
  const X = k => pad + k * (W - 2*pad) / (data.length - 1), Y = v => bottom - (v / max) * (bottom - top);
  const series = [['in','#22C55E'], ['out','#FF3B30']].map(([key, color]) => {
    const pts = data.map((x,k) => [X(k), Y(x[key])]), line = smoothPath(pts);
    return {key, color, line, area:`${line} L${pts.at(-1)[0]},${bottom} L${pts[0][0]},${bottom} Z`, last:pts.at(-1)};
  });
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `<defs>${series.map(s => `<linearGradient id="g-${s.key}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${s.color}" stop-opacity=".28"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>
    <line class="grid" x1="${pad}" x2="${W-pad}" y1="${bottom}" y2="${bottom}"/>
    <line class="grid" x1="${pad}" x2="${W-pad}" y1="${(top+bottom)/2}" y2="${(top+bottom)/2}"/>
    ${series.map(s => `<path class="area" d="${s.area}" fill="url(#g-${s.key})"/>
      <path class="line" d="${s.line}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linecap="round"/>
      <circle class="end" cx="${s.last[0]}" cy="${s.last[1]}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join('')}
    ${data.map((x,k) => `<text x="${X(k)}" y="${H-3}">${x.label}</text>`).join('')}`;
  if (animate) animateChart();
}
// Receta svg-path-draw: la línea se "dibuja" con stroke-dashoffset y el relleno aparece detrás
function animateChart(){
  chartDrawn = true;
  if (reduceMotion()) return;
  $('#chart').querySelectorAll('.line').forEach((p, k) => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.animate({strokeDashoffset:[len, 0]}, {duration:900, delay:k*120, easing:'cubic-bezier(.32,.72,0,1)', fill:'backwards'})
      .finished.then(() => p.style.strokeDasharray = '').catch(() => {});
  });
  $('#chart').querySelectorAll('.area,.end').forEach((el, k) =>
    el.animate({opacity:[0, 1]}, {duration:500, delay:500 + (k % 2) * 120, easing:'ease-out', fill:'backwards'}));
}

// El saldo "cuenta" hasta el nuevo valor. Con tone ('in' | 'out') los números van en verde o rojo
// mientras cambian y vuelven a su color al terminar.
let countRaf = 0;
function countTo(target, tone){
  const el = $('#balance'), from = shownBalance, t0 = performance.now();
  const dur = tone && !reduceMotion() ? 950 : tone ? 0 : 700;
  cancelAnimationFrame(countRaf);
  el.classList.remove('counting-in', 'counting-out');
  if (tone) el.classList.add('counting-' + tone);
  const step = now => {
    const p = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 4);
    shownBalance = from + (target - from) * e;
    el.textContent = eur.format(shownBalance);
    if (p < 1) countRaf = requestAnimationFrame(step);
    else if (tone) setTimeout(() => el.classList.remove('counting-' + tone), dur ? 250 : 600);
  };
  countRaf = requestAnimationFrame(step);
}

// Botón + y su menú
const body = document.body;
$('#fab').addEventListener('click', () => {
  if (body.classList.contains('sheet-open')) closeSheet();
  else if (body.classList.contains('cluster-open')) closeCluster();
  else body.classList.toggle('menu-open');
});
$('#scrim').addEventListener('click', () => { body.classList.remove('menu-open'); closeCluster(); closeSheet(); });
document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () =>
  b.dataset.open === 'out' ? openCluster() : openForm('in')));

// ── Burbujas de categoría en anillos alrededor del + ──
const cluster = $('#cluster');
const bubbles = CATS.map(c => {
  const el = document.createElement('button');
  el.className = 'cb'; el.dataset.cat = c.id; el.style.setProperty('--c', c.color);
  el.innerHTML = `<span class="ico">${c.emoji}</span><span>${c.name}</span>`;
  cluster.appendChild(el);
  return {el, x:0, y:0};
});

// Abanico compacto: cada burbuja se describe con sus dos piezas reales (el círculo y la pastilla del nombre),
// así una pastilla puede encajar bajo el hueco curvo de otro círculo. En cada anillo las burbujas se colocan
// una pegada a la siguiente (el menor giro que no choca) y luego el grupo se centra arriba → forma de abanico.
let layoutFor = 0;
function layoutCluster(){
  const vw = Math.min(innerWidth, 520);
  if (vw === layoutFor) return;                                  // ya calculado para este ancho
  layoutFor = vw;
  const half = vw / 2 - 6, RC = 27, GAP = 3;
  const minT = 4 * Math.PI / 180, maxT = Math.PI - minT, dT = .003;
  const lbl = bubbles.map(b => ({w: b.el.lastElementChild.offsetWidth, h: b.el.lastElementChild.offsetHeight}));
  const shape = (i, x, y) => ({x, y, w: lbl[i].w, h: lbl[i].h, ly: y + RC + 3 + lbl[i].h / 2});
  const cc = (ax, ay, ar, bx, by, br) => Math.hypot(ax - bx, ay - by) < ar + br + GAP;
  const cr = (cx, cy, r, x, y, w, h) => {                       // círculo contra rectángulo
    const dx = Math.max(Math.abs(cx - x) - w / 2, 0), dy = Math.max(Math.abs(cy - y) - h / 2, 0);
    return Math.hypot(dx, dy) < r + GAP;
  };
  const rr = (a, b) => Math.abs(a.x - b.x) < (a.w + b.w) / 2 + GAP && Math.abs(a.ly - b.ly) < (a.h + b.h) / 2 + GAP;
  const hit = (a, b) => cc(a.x, a.y, RC, b.x, b.y, RC) || cr(a.x, a.y, RC, b.x, b.ly, b.w, b.h)
                     || cr(b.x, b.y, RC, a.x, a.ly, a.w, a.h) || rr(a, b);
  const hitFab = a => cc(a.x, a.y, RC, 0, 0, 36) || cr(0, 0, 36, a.x, a.ly, a.w, a.h);
  const onScreen = a => Math.abs(a.x) + Math.max(RC, a.w / 2) < half && a.ly + a.h / 2 < 40;
  const at = (i, r, t) => shape(i, r * Math.cos(t), -r * Math.sin(t));

  // Un anillo de radio r con los elementos [k, k+n): devuelve sus formas centradas o null si no cabe
  function ring(k, n, r, placed){
    let t = maxT; const angs = [t];
    for (let i = 1; i < n; i++){
      const prev = at(k + i - 1, r, angs[i - 1]);
      do t -= .03; while (t > minT && hit(prev, at(k + i, r, t)));   // paso grueso…
      if (t <= minT) return null;
      while (!hit(prev, at(k + i, r, t + dT))) t += dT;               // …y retrocede hasta tocar
      angs.push(t);
    }
    const shift = (maxT + angs[n - 1]) / 2 - Math.PI / 2;          // centrar el abanico en la vertical
    const pts = angs.map((a, i) => at(k + i, r, a - shift));
    const bad = pts.some((p, i) => !onScreen(p) || hitFab(p) || placed.some(q => hit(p, q))
                                 || pts.slice(0, i).some(q => hit(p, q)));
    return bad ? null : pts;
  }

  const configs = [[3,4,4],[3,3,5],[2,4,5],[3,5,3],[4,3,4],[4,4,3],[4,7],[5,6],[3,8],[2,3,6],[2,4,5]];
  let best = null;
  for (const cfg of configs){
    const out = []; let k = 0, R = 64, ok = true;
    for (const n of cfg){
      let pts = null, r = R;
      for (; r < 460 && !pts; r += 6) pts = ring(k, n, r, out);       // radio grueso…
      if (!pts){ ok = false; break; }
      r -= 6;
      for (let rr2 = r - 5; rr2 < r; rr2++){ const q = ring(k, n, rr2, out); if (q){ pts = q; r = rr2; break; } } // …y afinado
      out.push(...pts); k += n; R = r + 20;
    }
    if (!ok) continue;
    const top = Math.min(...out.map(p => p.y - RC));
    if (!best || top > best.top) best = {top, out};             // la forma más baja = la más compacta
  }
  best?.out.forEach((p, i) => { bubbles[i].x = Math.round(p.x); bubbles[i].y = Math.round(p.y); });
}
addEventListener('resize', () => { if (body.classList.contains('cluster-open')) openCluster(); });

// Lee dónde está la burbuja AHORA para poder interrumpir a medio camino sin saltos
// Cerrada, cada burbuja espera girada hacia su lado: al abrir se endereza, como un abanico que se despliega
const folded = b => `translate(0px,0px) rotate(${Math.round(Math.atan2(b.x, -b.y) * 57.3)}deg) scale(.2)`;
function presentState(b){
  const cs = getComputedStyle(b.el);
  return {transform: cs.transform === 'none' || +cs.opacity === 0 ? folded(b) : cs.transform, opacity: cs.opacity};
}
// Todas a la vez: brotan del + hacia su sitio con un muelle
function openCluster(){
  body.classList.remove('menu-open');
  body.classList.add('cluster-open');
  layoutCluster();
  const reduce = reduceMotion();
  bubbles.forEach(b => {
    const from = presentState(b), to = `translate(${b.x}px,${b.y}px) rotate(0deg) scale(1)`;
    b.el.getAnimations().forEach(a => a.cancel());
    b.el.animate(reduce ? [{transform:to, opacity:from.opacity}, {transform:to, opacity:1}]
                        : [from, {transform:to, opacity:1}],
      {duration: reduce ? 200 : 520, easing:'cubic-bezier(.34,1.4,.64,1)', fill:'both'});
  });
}
function closeCluster(){
  if (!body.classList.contains('cluster-open')) return;
  body.classList.remove('cluster-open');
  const reduce = reduceMotion();
  // Vuelven todas juntas al botón, por el mismo camino
  bubbles.forEach(b => {
    const from = presentState(b);
    b.el.getAnimations().forEach(a => a.cancel());
    b.el.animate([from, reduce ? {transform:from.transform, opacity:0} : {transform:folded(b), opacity:0}],
      {duration: reduce ? 150 : 280, easing:'cubic-bezier(.32,.72,0,1)', fill:'both'});
  });
}
cluster.addEventListener('click', e => {
  const b = e.target.closest('.cb'); if (!b) return;
  navigator.vibrate?.(8);
  // Receta press-release-spring: pulso rápido antes de abrir el formulario
  b.querySelector('.ico').animate({transform:['scale(1)', 'scale(1.18)', 'scale(1)']}, {duration:260, easing:'cubic-bezier(.34,1.56,.64,1)'});
  setTimeout(() => { closeCluster(); openForm('out', b.dataset.cat); }, 170);
});

// Hojas inferiores
const sheet = $('#sheet');
function openSheet(html, type){
  $('#sheetBody').innerHTML = html;
  sheet.dataset.type = type || '';
  body.classList.remove('menu-open');
  body.classList.add('sheet-open');
  sheet.style.transform = '';
  requestAnimationFrame(() => sheet.classList.add('open'));
}
function closeSheet(){
  sheet.classList.remove('open');
  sheet.style.transform = '';
  body.classList.remove('sheet-open');
  document.activeElement?.blur();
}

function openForm(type, preselectedCat){
  const isIn = type === 'in', c = isIn ? INCOME : (CATS.find(x => x.id === preselectedCat) || CATS[0]);
  openSheet(`
    <div class="sheet-head"><h3>${isIn ? 'Nuevo ingreso' : 'Nuevo gasto'}</h3><button class="close" data-close>✕</button></div>
    ${isIn ? '' : `<div class="picked"><span class="ico" style="${tint(c.color)}">${c.emoji}</span>${c.name}</div>`}
    <label class="amount-wrap"><input id="amount" inputmode="decimal" placeholder="0,00" autocomplete="off"><span class="cur">€</span></label>
    <input class="field" id="note" maxlength="40" placeholder="${isIn ? 'Motivo (opcional) · ej. Nómina' : 'Concepto (opcional) · ej. Cena con amigos'}">
    <button class="primary" id="saveBtn">${isIn ? 'Añadir ingreso' : 'Añadir gasto'}</button>`, type);

  // Detrás de la hoja dejamos a la vista la tarjeta del saldo, para ver luego cómo cambian los números
  if (scrollY > 0) scrollTo({top:0, behavior: reduceMotion() ? 'auto' : 'smooth'});
  if (page !== 0) goPage(0);
  setTimeout(() => $('#amount').focus(), 350);
  $('#saveBtn').addEventListener('click', () => {
    const amount = parseFloat(($('#amount').value || '').replace(/\./g,'').replace(',', '.'));
    if (!(amount > 0)){ const w = $('.amount-wrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake'); return; }
    const m = {id:Date.now(), type, amount:Math.round(amount*100)/100, note:$('#note').value.trim(), date:new Date().toISOString()};
    if (!isIn) m.cat = c.id;
    movs.push(m); justAdded = m.id; chartDrawn = false; save(); closeSheet();
    navigator.vibrate?.(12);
    if (scrollY > 0) scrollTo({top:0});
    if (page !== 0) goPage(0);
    // Esperamos a que la hoja baje: así el conteo en color se ve entero sobre la tarjeta
    setTimeout(() => {
      render(type);
      const card = $('.card'); card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
    }, reduceMotion() ? 0 : 260);
  });
}

// Detalle de un movimiento (con opción de eliminar)
$('#movs').addEventListener('click', e => {
  const row = e.target.closest('.mov'); if (!row) return;
  const m = movs.find(x => String(x.id) === row.dataset.id); if (!m) return;
  const c = catOf(m);
  openSheet(`
    <div class="sheet-head"><h3>Detalle</h3><button class="close" data-close>✕</button></div>
    <div class="detail"><div class="ico" style="${tint(c.color)}">${c.emoji}</div>
      <div class="amt ${m.type}">${m.type === 'in' ? '+' : '−'}${eur.format(m.amount)}</div>
      <p><b>${esc(m.note || c.name)}</b></p>
      <p>${m.type === 'in' ? 'Ingreso' : c.name} · ${new Date(m.date).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</p></div>
    <button class="danger" id="del">Eliminar movimiento</button>`);
  $('#del').addEventListener('click', () => {
    closeSheet();
    lastDeleted = {m, idx:movs.indexOf(m)};
    row.classList.add('leaving');
    setTimeout(() => { movs.splice(movs.indexOf(m), 1); save(); render(); toast('Movimiento eliminado'); }, 320);
  });
});
sheet.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });

// Arrastrar la hoja hacia abajo para cerrarla: sigue al dedo y decide por velocidad
(() => {
  let y0 = 0, dy = 0, t0 = 0, lastY = 0, v = 0, active = false;
  const grab = $('#grab');
  grab.addEventListener('pointerdown', e => { active = true; y0 = lastY = e.clientY; t0 = performance.now(); dy = 0; v = 0;
    grab.setPointerCapture(e.pointerId); sheet.classList.add('dragging'); });
  grab.addEventListener('pointermove', e => { if (!active) return;
    const now = performance.now(); v = (e.clientY - lastY) / Math.max(1, now - t0) * 1000; lastY = e.clientY; t0 = now;
    dy = e.clientY - y0;
    const y = dy > 0 ? dy : -(Math.abs(dy) * 60) / (60 + Math.abs(dy)); // resistencia elástica hacia arriba
    sheet.style.transform = `translateY(${y}px)`; });
  const end = () => { if (!active) return; active = false; sheet.classList.remove('dragging');
    if (dy > 120 || v > 700) closeSheet(); else sheet.style.transform = ''; };
  grab.addEventListener('pointerup', end); grab.addEventListener('pointercancel', end);
})();

// ── Carrusel Saldo ↔ Resumen ──
// Sigue al dedo 1:1, proyecta el impulso al soltar (fórmula de Apple) y se puede agarrar a mitad de animación.
(() => {
  const pager = $('#pager'), track = $('#track'), pages = [...track.children], dots = [...document.querySelectorAll('.pdot')];
  const last = pages.length - 1;
  const step = () => pages[0].offsetWidth + 32;               // ancho de página + hueco (gap del .track)
  const project = v => (v / 1000) * 0.998 / (1 - 0.998);
  const rubber = (o, dim) => (o * dim * .55) / (dim + .55 * Math.abs(o));
  let x = 0;

  function setX(nx, animate){
    x = nx;
    const ease = animate ? `transform .55s var(--ease-ios)` : 'none';
    track.style.transition = ease;
    track.style.transform = `translate3d(${x}px,0,0)`;
    // La tarjeta que se aleja baja un poco de escala → sensación de profundidad
    const p = -x / step();
    pages.forEach((pg, k) => { pg.style.transition = ease; pg.style.transform = `scale(${1 - .06 * Math.min(1, Math.abs(p - k))})`; });
  }
  function goTo(n, animate = true){
    const prev = page;
    page = Math.max(0, Math.min(last, n));
    setX(-page * step(), animate);
    dots.forEach((d, k) => { d.classList.toggle('on', k === page); d.setAttribute('aria-selected', k === page); });
    if (page === 1 && (prev !== 1 || !chartDrawn)) setTimeout(animateChart, animate ? 180 : 0);
  }
  // Posición real en pantalla (por si se agarra mientras anima)
  const currentX = () => new DOMMatrixReadOnly(getComputedStyle(track).transform).m41;

  let x0 = 0, y0 = 0, start = 0, dir = null, lastX = 0, lastT = 0, v = 0, id = null;
  pager.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    id = e.pointerId; dir = null; x0 = lastX = e.clientX; y0 = e.clientY; lastT = performance.now(); v = 0;
    start = currentX(); setX(start, false);
  });
  pager.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!dir){                                                 // holgura de 10 px antes de decidir dirección
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      if (dir === 'v'){ id = null; goTo(page); return; }      // es scroll vertical: no lo tocamos
      pager.setPointerCapture(e.pointerId);
    }
    const now = performance.now();
    v = (e.clientX - lastX) / Math.max(1, now - lastT) * 1000; lastX = e.clientX; lastT = now;
    let nx = start + dx; const min = -last * step();
    if (nx > 0) nx = rubber(nx, pager.offsetWidth);             // resistencia elástica en los bordes
    else if (nx < min) nx = min + rubber(nx - min, pager.offsetWidth);
    setX(nx, false);
  });
  const end = e => {
    if (e.pointerId !== id) return; id = null;
    if (dir !== 'h'){ goTo(page); return; }
    if (performance.now() - lastT > 80) v = 0;                 // si se quedó quieto antes de soltar, sin impulso
    const target = Math.round(-(x + project(v)) / step());
    goTo(Math.max(page - 1, Math.min(page + 1, target)));     // como mucho una página por gesto
  };
  pager.addEventListener('pointerup', end);
  pager.addEventListener('pointercancel', end);
  // Evita que un deslizamiento termine "pulsando" algo
  pager.addEventListener('click', e => { if (dir === 'h') e.stopPropagation(); }, true);

  dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.page)));
  document.addEventListener('keydown', e => {
    if (body.classList.contains('sheet-open')) return;
    if (e.key === 'ArrowRight') goTo(page + 1); else if (e.key === 'ArrowLeft') goTo(page - 1);
  });
  addEventListener('resize', () => { goTo(page, false); drawChart(false); });
  goPage = goTo;
  goTo(0, false);
})();

// Aviso con "Deshacer"
let toastTimer;
function toast(msg){
  $('#toastMsg').textContent = msg; $('#toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 4000);
}
$('#undo').addEventListener('click', () => {
  if (lastDeleted){ movs.splice(lastDeleted.idx, 0, lastDeleted.m); lastDeleted = null; save(); render(); }
  $('#toast').classList.remove('show');
});

const hoy = new Date().toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'});
$('#today').textContent = hoy[0].toUpperCase() + hoy.slice(1);
render();
// El abanico se calcula en un momento libre, para que al pulsar Gasto ya esté listo
(window.requestIdleCallback || setTimeout)(() => layoutCluster());

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
